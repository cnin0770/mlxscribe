[project]
name = "mlxscribe"
version = "0.1.0"
description = "Local-first transcription CLI powered by mlx-whisper."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-whisper>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mlxscribe = "mlxscribe.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
